<!doctype html><html><head><meta charset="utf-8"><style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#o{--a:#d7b84a;--nc:#fff;--vc:#d7b84a;width:100%;height:100%;position:relative;color:var(--nc);user-select:none}.name{font-family:var(--nf);}.value{font-family:var(--vf);color:var(--vc);font-weight:900}.drag{display:none;position:absolute;z-index:20;inset:0;border:2px dashed #48a6ff;-webkit-app-region:drag}.editing .drag{display:block}
.s0{display:flex;align-items:center;justify-content:center;gap:22px;background:linear-gradient(120deg,#12151b,#252a32);border-left:7px solid var(--a);clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%)}.s0 .name{font-size:18px;font-weight:800}.s0 .value{font-size:58px}
.s1{display:grid;grid-template-columns:1fr 90px;align-items:center;background:#090b10;border:2px solid var(--a);box-shadow:inset 0 0 28px #000}.s1:before,.s1:after{content:'';position:absolute;width:34px;height:3px;background:var(--a)}.s1:before{top:8px;left:8px}.s1:after{right:8px;bottom:8px}.s1 .name{text-align:center;letter-spacing:.22em;font-size:15px}.s1 .value{text-align:center;font-size:54px;text-shadow:0 0 12px var(--a)}
.s2{display:flex;align-items:flex-end;background:transparent}.s2 .name{background:#11151b;padding:11px 24px 11px 18px;font-size:16px;font-weight:700;border-bottom:4px solid var(--a)}.s2 .value{background:var(--a);color:#111;padding:5px 18px;font-size:50px;line-height:1;border-radius:10px 10px 0 0}
.s3{display:flex;align-items:center;justify-content:center;gap:15px;background:linear-gradient(100deg,#220609,#09090b 70%);clip-path:polygon(7% 0,100% 0,93% 100%,0 100%)}.s3:before{content:'////';color:var(--a);font-weight:900}.s3 .name{font-size:18px;font-weight:900}.s3 .value{font-size:62px}
.s4{display:grid;place-items:center;background:rgba(13,15,18,.9);border-radius:50%}.s4:before{content:'';position:absolute;width:92px;height:92px;border:4px solid var(--a);border-radius:50%;right:18px}.s4 .name{position:absolute;left:26px;font-size:17px;font-weight:800;max-width:180px}.s4 .value{position:absolute;right:45px;font-size:48px}
.s5{display:flex;align-items:center;justify-content:space-around;background:rgba(28,32,40,.42);backdrop-filter:blur(12px);border-radius:24px;border:1px solid rgba(255,255,255,.3)}.s5 .name{font-size:17px}.s5 .value{font-size:56px}
.s6{display:grid;grid-template-rows:35% 65%;text-align:center;background:#111;border:5px double var(--a);box-shadow:7px 7px 0 #000}.s6 .name{align-self:end;font-size:15px;letter-spacing:.15em}.s6 .value{font-size:52px}
.s7{display:flex;align-items:stretch;background:#101217}.s7 .name{display:flex;align-items:center;padding:0 25px;background:var(--a);color:#111;font-size:18px;font-weight:900;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%)}.s7 .value{display:flex;align-items:center;padding:0 25px;font-size:58px}
.s8{display:flex;align-items:center;justify-content:center;gap:28px;background:#0a0d14;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}.s8:after{content:'';position:absolute;inset:8px;border-top:2px solid var(--a);border-bottom:2px solid var(--a)}.s8 .name{font-size:16px;font-weight:700;transform:skew(-8deg)}.s8 .value{font-size:62px;transform:skew(-8deg)}
.s9{display:flex;align-items:center;justify-content:center;gap:22px;background:linear-gradient(135deg,#181714,#302a20);border-radius:0 30px 0 30px;border:1px solid #8f826b}.s9:before{content:'◆';color:var(--a);font-size:18px}.s9 .name{font-size:18px;letter-spacing:.08em}.s9 .value{font-size:56px;font-weight:500}

html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:transparent}
#streakHost,#mapHost{position:absolute;transform-origin:top left}
#o{width:100%;height:100%;}
#mapHost img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 8px #000)}
</style></head><body><div id="stage">
<div id="streakHost"><div id="o"><div class="name" id="n">WIN STREAK</div><div class="value" id="v">0</div></div></div>
<div id="mapHost"><img id="mapImg"></div>
</div><script>
let lastMapKey='';
function draw(s){
 const sh=document.getElementById('streakHost'), mh=document.getElementById('mapHost'), o=document.getElementById('o');
 sh.style.display=(s.streakEnabled&&s.streak.visible)?'block':'none';
 sh.style.left=s.streak.x+'px'; sh.style.top=s.streak.y+'px'; sh.style.width=s.streak.w+'px'; sh.style.height=s.streak.h+'px';
 o.className='s'+s.style;
 o.style.setProperty('--a',s.accent);o.style.setProperty('--nc',s.nameColor);o.style.setProperty('--vc',s.numberColor);o.style.setProperty('--nf',s.nameFont);o.style.setProperty('--vf',s.numberFont);
 document.getElementById('n').textContent=s.title;document.getElementById('v').textContent=s.value;
 mh.style.display=(s.mapEnabled&&s.map.visible&&s.map.image)?'block':'none';
 mh.style.left=s.map.x+'px';mh.style.top=s.map.y+'px';mh.style.width=s.map.w+'px';mh.style.height=s.map.h+'px';
 const key=s.map.image||'';if(key&&key!==lastMapKey){document.getElementById('mapImg').src='/map-image?t='+Date.now();lastMapKey=key}
}
async function tick(){try{const s=await fetch('/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());draw(s)}catch(e){}}
tick();setInterval(tick,250);
</script></body></html>
