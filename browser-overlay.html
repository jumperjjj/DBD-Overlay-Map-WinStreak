<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI;color:white}#root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.box{padding:20px 28px;background:#111d;border-left:6px solid var(--a);display:flex;gap:22px;align-items:center}.name{font-family:var(--nf);color:var(--nc);font-size:24px;font-weight:800}.value{font-family:var(--vf);color:var(--vc);font-size:64px;font-weight:900}img{max-width:100%;max-height:100%;object-fit:contain}
</style></head><body><div id=root></div><script>
const MODE='__MODE__';async function tick(){try{let s=await fetch('/state?x='+Date.now()).then(r=>r.json());if(MODE==='winstreak'){root.innerHTML='<div class=box><div class=name></div><div class=value></div></div>';let b=root.firstChild;b.style.setProperty('--a',s.accent);b.style.setProperty('--nf',s.nameFont);b.style.setProperty('--vf',s.numberFont);b.style.setProperty('--nc',s.nameColor);b.style.setProperty('--vc',s.numberColor);b.querySelector('.name').textContent=s.title;b.querySelector('.value').textContent=s.value;root.style.display=s.streakEnabled?'flex':'none'}else{root.style.display=(s.mapEnabled&&s.map.visible)?'flex':'none';root.innerHTML=s.map.image?'<img>':'';if(s.map.image)root.firstChild.src='file:///'+s.map.image.replace(/\\/g,'/')}}catch{}}tick();setInterval(tick,700);
</script></body></html>
