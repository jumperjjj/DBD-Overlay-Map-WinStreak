<!doctype html><html><head><meta charset="utf-8"><style>
html,body,#stage{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
iframe{position:absolute;border:0;background:transparent;overflow:hidden}
</style></head><body><div id=stage><iframe id=streakFrame src="/streak-frame"></iframe><iframe id=teamFrame src="/team-frame"></iframe></div><script>
async function tick(){try{const s=await fetch('/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());const a=document.getElementById('streakFrame'),b=document.getElementById('teamFrame');a.style.display=(s.streakEnabled&&s.streak.visible)?'block':'none';a.style.left=s.streak.x+'px';a.style.top=s.streak.y+'px';a.style.width=s.streak.w+'px';a.style.height=s.streak.h+'px';b.style.display=(s.teamEnabled&&s.team.visible)?'block':'none';b.style.left=s.team.x+'px';b.style.top=s.team.y+'px';b.style.width=s.team.w+'px';b.style.height=s.team.h+'px'}catch{}}tick();setInterval(tick,250);
</script></body></html>
