<!doctype html><html><head><meta charset="utf-8"><style>html,body,#stage{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}iframe{position:absolute;border:0;background:transparent;overflow:hidden}</style></head><body><div id=stage><iframe id=streakFrame src="/streak-frame"></iframe><iframe id=teamFrame src="/team-frame"></iframe></div><script>
const a=document.getElementById('streakFrame'),b=document.getElementById('teamFrame');async function tick(){try{const s=await fetch('/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());a.style.display=s.streakEnabled?'block':'none';Object.assign(a.style,{left:s.streak.x+'px',top:s.streak.y+'px',width:s.streak.w+'px',height:s.streak.h+'px'});b.style.display=s.teamEnabled?'block':'none';Object.assign(b.style,{left:s.team.x+'px',top:s.team.y+'px',width:s.team.w+'px',height:s.team.h+'px'})}catch{}}tick();setInterval(tick,200);
</script></body></html>
