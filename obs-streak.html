<!doctype html><html><head><meta charset=utf-8><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#o{width:100%;height:100%;position:relative;display:flex;align-items:flex-start;justify-content:flex-start;gap:10px;padding-top:18px;padding-left:54px;font-family:Segoe UI;color:#fff}.bg,.deco{position:absolute;pointer-events:none;scale:1.08 .56;translate:-40px -96px}.bg{opacity:var(--op)}.name,.value{position:relative;z-index:2;white-space:nowrap;translate:0 8px}.name{font-family:var(--nf);font-size:var(--ns);font-weight:var(--bold);color:var(--nc);transform:translateX(var(--nx))}.value{font-family:var(--vf);font-size:var(--vs);font-weight:900;color:var(--vc);line-height:1;transform:translateX(var(--vx))}
.shadow{filter:drop-shadow(0 7px 7px #000c)}.record{display:none;position:absolute;left:calc(15px + (100% - 142px)*var(--rx,0)/100);top:calc(92px + (100% - 149px)*var(--ry,0)/100);z-index:3;align-items:center;justify-content:center;gap:6px;padding:3px 8px;background:var(--rb);font-size:9px;width:127px;min-width:127px;box-sizing:border-box}.record b{font-size:16px;color:var(--rvc)}.record#record2{left:calc(15px + (100% - 142px)*var(--r2x,0)/100);top:calc(123px + (100% - 180px)*var(--r2y,0)/100)}.record span{color:var(--rnc);font-weight:800;letter-spacing:.7px;text-shadow:0 0 var(--mg) var(--rnc)}.record b{text-shadow:0 0 var(--mg) var(--rvc)}
.s1 .bg{inset:24% 19%;background:var(--b1);clip-path:polygon(4% 0,94% 0,100% 50%,94% 100%,4% 100%,0 50%)}.s1 .deco{inset:12%;border-left:5px solid var(--a)}
.s2 .bg{inset:27% 16%;background:var(--b1);border:2px solid var(--a);box-shadow:inset 0 0 18px color-mix(in srgb,var(--a) 35%,transparent);transform:skew(-7deg)}

.s3 .bg{inset:30% 15%;background:linear-gradient(105deg,var(--b1) 0 64%,color-mix(in srgb,var(--a) 24%,var(--b1)) 64% 100%);clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);border-left:3px solid var(--a);border-bottom:2px solid var(--a)}.s3 .deco{inset:30% 15%;clip-path:polygon(72% 0,100% 0,93% 100%,64% 100%);background:linear-gradient(120deg,transparent 0 38%,var(--a) 39% 42%,transparent 43% 58%,color-mix(in srgb,var(--a) 55%,transparent) 59% 63%,transparent 64%)}
.s4 .bg{inset:29% 18%;background:var(--b1);border:2px solid var(--a);border-radius:34px}.s4 .value{border:0;border-radius:0;padding:0}
.s5.shadow{filter:none}.s5 .bg{inset:28% 16%;background:color-mix(in srgb,var(--b1) 76%,transparent);border:1px solid #fff5;border-radius:28px;box-shadow:none;filter:none}
.s6 .bg{inset:30% 19%;background:var(--b1);border:4px double var(--a);box-shadow:5px 5px #000}
.s7 .bg{inset:33% 16%;background:var(--b1)}.s7 .deco{inset:33% 16%;border-left:8px solid var(--a);border-right:2px solid var(--a)}
.s8 .bg{inset:30% 18%;background:var(--b1);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);border-top:3px solid var(--a);border-bottom:3px solid var(--a)}
.s9 .bg{inset:30% 16%;background:linear-gradient(90deg,transparent 0 4%,var(--b1) 4% 96%,transparent 96%);border-top:1px solid var(--a);border-bottom:2px solid var(--a);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}

.s1 .record{clip-path:polygon(5% 0,94% 0,100% 50%,94% 100%,5% 100%,0 50%);border-left:3px solid var(--ra)}
.s2 .record{border:1px solid var(--ra);transform:skew(-7deg)}

.s3 .record{clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);border-left:3px solid var(--ra)}
.s4 .record{border:2px solid var(--ra);border-radius:999px}.s5 .record{border:1px solid #fff5;border-radius:16px;box-shadow:none;filter:none}
.s6 .record{border:3px double var(--ra);box-shadow:3px 3px #000}.s7 .record{border-left:5px solid var(--ra);border-right:1px solid var(--ra)}
.s8 .record{clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);border-top:2px solid var(--ra);border-bottom:2px solid var(--ra)}
.s9 .record{border-top:1px solid var(--ra);border-bottom:2px solid var(--ra);clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}

.s10 .bg{inset:29% 15%;background:linear-gradient(90deg,color-mix(in srgb,var(--a) 18%,var(--b1)),var(--b1) 30% 70%,color-mix(in srgb,var(--a) 18%,var(--b1)));clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);border-top:2px solid var(--a);border-bottom:2px solid var(--a)}
.s10 .deco{inset:29% 15%;background:linear-gradient(90deg,var(--a) 0 2px,transparent 2px calc(100% - 2px),var(--a) calc(100% - 2px))}
.s10 .record{clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);border-top:1px solid var(--ra);border-bottom:1px solid var(--ra)}
.edit{outline:5px solid #ff2525;outline-offset:-5px;-webkit-app-region:drag}
</style></head><body><div id=o><div class=bg></div><div class=deco></div><div id=n class=name></div><div id=v class=value></div><div id=record class=record><span id=rn></span><b id=rv></b></div><div id=record2 class=record><span id=r2n></span><b id=r2v></b></div></div><script>
const o=document.getElementById('o');function draw(S){const s=S.streak;o.className='s'+(+s.style+2)+(s.shadow?' shadow':'');const x={'--a':s.accent,'--b1':s.bg1,'--op':s.opacity,'--nc':s.nameColor,'--vc':s.valueColor,'--nf':s.fontName,'--vf':s.fontValue,'--ns':s.nameSize+'px','--vs':s.valueSize+'px','--nx':s.nameX+'px','--vx':s.valueX+'px','--bold':s.bold?900:500,'--rb':s.recordBg||'#15191f','--rnc':s.recordNameColor||'#fff','--rvc':s.recordValueColor||'#d7b84a','--ra':s.recordAccent||'#d7b84a','--rx':Math.max(0,Math.min(100,+s.recordX||0)),'--ry':Math.max(0,Math.min(100,+s.recordY||0)),
'--r2x':Math.max(0,Math.min(100,+s.record2X||0)),'--r2y':Math.max(0,Math.min(100,+s.record2Y||0)),'--mg':(Math.max(0,Math.min(100,+s.glow||0))/100*7)+'px','--globalScale':Math.max(.6,Math.min(1.2,+s.scale||1))};for(const[k,v]of Object.entries(x))o.style.setProperty(k,v);n.textContent=s.title;v.textContent=s.value;record.style.display=s.recordShow?'flex':'none';rn.textContent=s.recordTitle||'';rv.textContent=s.recordValue??0;
record2.style.display=s.record2Show?'flex':'none';r2n.textContent=s.record2Title||'';r2v.textContent=s.record2Value??0;
record2.style.setProperty('--rb',s.record2Bg||'#15191f');record2.style.setProperty('--rnc',s.record2NameColor||'#fff');record2.style.setProperty('--rvc',s.record2ValueColor||'#d7b84a');record2.style.setProperty('--ra',s.record2Accent||'#d7b84a');const gg=Math.max(0,Math.min(100,+s.glow||0))/100,gblur=gg*7;n.style.textShadow=gg?`0 0 ${gblur.toFixed(2)}px ${s.nameColor}`:'none';v.style.textShadow=gg?`0 0 ${gblur.toFixed(2)}px ${s.valueColor}`:'none';n.style.filter='none';v.style.filter='none'}async function tick(){try{draw(await fetch('/state?'+Date.now(),{cache:'no-store'}).then(r=>r.json()))}catch{}}tick();setInterval(tick,150);</script></body></html>
