<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#w{position:absolute;inset:0}img{width:100%;height:100%;object-fit:contain;display:block}.editing{outline:5px solid #ff2020;outline-offset:-5px}
.handle{display:none;position:absolute;z-index:20;background:#ff2020;border:2px solid white;width:14px;height:14px}.editing .handle{display:block}
.handle.nw{left:0;top:0;cursor:nwse-resize}.handle.ne{right:0;top:0;cursor:nesw-resize}.handle.sw{left:0;bottom:0;cursor:nesw-resize}.handle.se{right:0;bottom:0;cursor:nwse-resize}
.handle.n{left:50%;top:0;cursor:ns-resize}.handle.s{left:50%;bottom:0;cursor:ns-resize}.handle.w{left:0;top:50%;cursor:ew-resize}.handle.e{right:0;top:50%;cursor:ew-resize}

.editing{-webkit-app-region:drag}
.editing .handle{-webkit-app-region:no-drag}
</style></head><body><div id="w"><img id="im"><div class="handle nw" data-edge="nw"></div><div class="handle n" data-edge="n"></div><div class="handle ne" data-edge="ne"></div><div class="handle e" data-edge="e"></div><div class="handle se" data-edge="se"></div><div class="handle s" data-edge="s"></div><div class="handle sw" data-edge="sw"></div><div class="handle w" data-edge="w"></div></div>
<script>
const w=document.getElementById('w'),im=document.getElementById('im');function draw(s){if(s.map.image)im.src='file:///'+s.map.image.replace(/\\/g,'/')+'?t='+Date.now()}
api.get().then(x=>draw(x.settings));api.onSettings(draw);api.onEdit(x=>w.classList.toggle('editing',x));
document.querySelectorAll('.handle').forEach(h=>h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();api.resizeStart('map',h.dataset.edge)}));window.addEventListener('mouseup',()=>api.resizeEnd());
</script></body></html>
