<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI;color:white}#wrap{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center}img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 9px #000)}#fallback{padding:18px 24px;background:rgba(12,13,16,.88);border:1px solid #777;border-radius:10px;text-align:center}.name{font-weight:800;font-size:20px}.hint{font-size:12px;color:#aaa;margin-top:6px}.drag{display:none;position:absolute;inset:0;border:2px dashed #4aa3ff}.editing .drag{display:block}</style></head><body><div id=wrap><img id=img hidden><div id=fallback><div class=name id=name>Nenhum mapa</div><div class=hint>Escolha a imagem no programa</div></div><div class=drag></div></div><script>
function draw(s){let m=s.map;name.textContent=m.name||'Nenhum mapa';if(m.image){img.src='file:///'+m.image.replace(/\\/g,'/');img.hidden=false;fallback.hidden=true}else{img.hidden=true;fallback.hidden=false}}api.get().then(x=>draw(x.settings));api.onSettings(draw);api.onEdit(x=>document.body.classList.toggle('editing',x));
</script></body></html>
