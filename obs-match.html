.theme-7 .head{background:transparent;border:0;gap:7px}.theme-7 .team{height:52px;display:flex;align-items:center;background:#0a0d13e8;border-bottom:3px solid currentColor}.theme-7 .teamA{justify-content:flex-end;color:var(--a);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}.theme-7 .teamB{color:var(--b);clip-path:polygon(10px 0,100% 0,100% 100%,0 100%)}.theme-7 .center{background:#05070be8;border:1px solid #ffffff26;border-radius:8px;padding:4px 6px}.theme-7 .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px}.theme-7 .row{grid-template-columns:82px 1fr;border:0;border-left:3px solid var(--row-color);border-radius:7px;background:#0a0d13d9}.theme-7 .label{font-size:8px;background:#ffffff08}.theme-7 .footer{justify-content:center;background:transparent;border-top:1px solid #ffffff20}.theme-7 .killerCard{border-radius:8px}

</style></head><body><div id="root"><div id="titleBox" class="titleBox"><div id="setText" class="set"></div></div><div id="killerCard" class="killerCard"><img id="killerImg"><div id="killerName" class="killerName"></div></div><div id="shell" class="shell"><div class="head"><div id="teamA" class="team teamA"></div><div class="center"><div class="score"><span id="scoreA"></span><span id="separator"> : </span><span id="scoreB"></span></div></div><div id="teamB" class="team teamB"></div></div><div id="rows" class="rows"></div><div id="footer" class="footer"></div></div><i class="handle nw" data-edge="nw"></i><i class="handle ne" data-edge="ne"></i><i class="handle sw" data-edge="sw"></i><i class="handle se" data-edge="se"></i></div><script>

</script><script>
const root=document.getElementById('root'),shell=document.getElementById('shell'),titleBox=document.getElementById('titleBox'),killerCard=document.getElementById('killerCard'),killerImg=document.getElementById('killerImg'),killerName=document.getElementById('killerName');

function draw(S){const s=S.match;root.className='theme-'+Math.max(0,Math.min(15,+s.style||0))+(s.killerImage?(s.killerLeft?' leftK':' rightK'):'');root.style.setProperty('--a',s.colorA);root.style.setProperty('--b',s.colorB);root.style.setProperty('--bg',s.bg);root.style.setProperty('--panel',s.panel);root.style.setProperty('--text',s.text);root.style.setProperty('--set-color',s.setColor||'#d7dce5');root.style.setProperty('--footer-color',s.footerColor||'#f2f2f2');root.style.setProperty('--footer-bg',s.footerBg||s.bg);root.style.setProperty('--killer-bg',(s.killerBg||'#0b0e14')+'dd');root.style.setProperty('--team-font',s.fontName||'Segoe UI');root.style.setProperty('--score-font',s.fontNumber||'Segoe UI');root.style.setProperty('--set-font',s.fontSet||'Segoe UI');const setSize=Math.max(8,Math.min(16,+s.setTextSize||9));const showTitle=s.showSetText!==false;const titleH=Math.max(24,setSize+14);const titleGap=2;const titleSpace=showTitle?titleH+titleGap:0;root.style.paddingTop=(8+titleSpace)+'px';root.style.setProperty('--title-shift',s.killerImage?(s.killerLeft?'60px':'-60px'):'0px');titleBox.classList.toggle('hidden',!showTitle);titleBox.style.height=titleH+'px';titleBox.style.fontSize=setSize+'px';setText.style.fontSize=setSize+'px';teamA.textContent=s.teamA||'TIME A';teamB.textContent=s.teamB||'TIME B';scoreA.textContent=String(Math.max(0,Number(s.scoreA)||0));scoreB.textContent=String(Math.max(0,Number(s.scoreB)||0));separator.style.color=s.scoreSepColor||'#f2f2f2';teamA.style.color=s.colorA;teamB.style.color=s.colorB;scoreA.style.color=s.colorA;scoreB.style.color=s.colorB;document.querySelector('.head').style.boxShadow=s.edgeBorder?`inset 3px 0 ${s.colorA}, inset -3px 0 ${s.colorB}`:'';document.querySelector('.head').style.boxShadow=s.edgeBorder?`inset 3px 0 ${s.colorA}, inset -3px 0 ${s.colorB}`:'none';setText.textContent=s.setText||'';const glow=Math.max(0,Math.min(100,+s.glow||0))/100*8;teamA.style.textShadow=glow?`0 0 ${glow}px ${s.colorA}`:'none';teamB.style.textShadow=glow?`0 0 ${glow}px ${s.colorB}`:'none';scoreA.style.textShadow=glow?`0 0 ${glow}px ${s.colorA}`:'none';scoreB.style.textShadow=glow?`0 0 ${glow}px ${s.colorB}`:'none';rows.innerHTML='';(s.rows||[]).filter(r=>r.show).forEach(r=>{const d=document.createElement('div');d.className='row';d.style.setProperty('--row-color',r.color||s.colorA);d.style.setProperty('--row-text-color',r.textColor||s.text||'#ffffff');const l=document.createElement('div');l.className='label';l.textContent=r.label||'';const t=document.createElement('div');t.className='rowText';t.textContent=r.text||'';d.append(l,t);rows.appendChild(d)});footer.style.display=s.footerShow?'flex':'none';footer.style.justifyContent=s.footerCenter?'center':'flex-start';footer.textContent=s.footer||'';root.classList.toggle('rightK',!!s.killerImage&&!s.killerLeft);root.classList.toggle('leftK',!!s.killerImage&&!!s.killerLeft);if(s.killerImage){killerCard.style.display='flex';killerCard.style.background=(s.killerBg||'#0b0e14')+'dd';const url='http://127.0.0.1:17384/killer?name='+encodeURIComponent(s.killerImage);if(killerImg.dataset.src!==url){killerImg.dataset.src=url;killerImg.src=url}killerName.textContent=s.showKillerName?(s.killerName||''):'';killerName.style.display=s.showKillerName&&s.killerName?'block':'none';requestAnimationFrame(()=>{const sh=Math.max(1,Math.round(shell.getBoundingClientRect().height));if(killerCard.style.height!==sh+'px')killerCard.style.height=sh+'px'})}else{killerCard.style.display='none';killerImg.dataset.src=''}}
api.get().then(x=>draw(x.state));api.onState(draw);
let editMode=false;api.onEdit(v=>{editMode=v;root.classList.toggle('edit',v)});
root.addEventListener('pointerdown',e=>{if(!editMode||e.target.closest('.handle'))return;e.preventDefault();root.setPointerCapture?.(e.pointerId);api.dragStart('match',{x:e.screenX,y:e.screenY})});root.addEventListener('pointermove',e=>{if(editMode&&root.hasPointerCapture?.(e.pointerId))api.dragMove({x:e.screenX,y:e.screenY})});function endDrag(e){if(root.hasPointerCapture?.(e.pointerId))root.releasePointerCapture?.(e.pointerId);api.dragEnd()}root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
document.querySelectorAll('.handle').forEach(el=>el.addEventListener('pointerdown',e=>{if(!editMode)return;e.stopPropagation();e.preventDefault();el.setPointerCapture?.(e.pointerId);api.resizeStart('match',el.dataset.edge,{x:e.screenX,y:e.screenY});const mv=ev=>api.resizeMove({x:ev.screenX,y:ev.screenY});const up=ev=>{el.releasePointerCapture?.(ev.pointerId);el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);api.resizeEnd()};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}));
