<!doctype html><html><head><meta charset=utf-8><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial}#o{width:100%;height:100%;padding:var(--pad);color:var(--text);display:flex;flex-direction:column;justify-content:center}.shell{width:100%;filter:drop-shadow(0 7px 8px #000b)}.head{height:var(--hh);display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;background:var(--bg);border:1px solid #fff2}.team{font-size:var(--ts);font-weight:900;padding:0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.left{text-align:right}.center{text-align:center}.set{font-size:10px;letter-spacing:1.7px;color:var(--muted);font-weight:800}.score{font-size:var(--ss);font-family:Arial Black,Impact;font-weight:900;line-height:1}.rows{display:flex;flex-direction:column;gap:var(--gap);margin-top:var(--gap)}.row{height:var(--rh);display:grid;grid-template-columns:190px 1fr 1fr;align-items:center;background:var(--panel);border-left:4px solid var(--a);border-right:4px solid var(--b)}.label{height:100%;display:flex;align-items:center;padding:0 10px;background:#0003;color:var(--muted);font-size:11px;font-weight:800}.val{padding:0 12px;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.va{text-align:right;color:var(--a)}.vb{color:var(--b)}.foot{height:24px;margin-top:var(--gap);display:flex;align-items:center;padding:0 12px;background:color-mix(in srgb,var(--panel) 82%,transparent);font-size:11px;color:var(--muted)}
.s2 .head{clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%)}.s2 .row{border-left-width:2px;border-right-width:2px}.s3 .head{border-radius:10px 10px 0 0}.s3 .rows{gap:1px;margin-top:1px}.s3 .foot{margin-top:1px;border-radius:0 0 10px 10px}.s4 .head,.s4 .row,.s4 .foot{clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}.s5 .head{background:transparent;border:0;border-bottom:2px solid #fff4}.s5 .row{border-right:0}.s5 .foot{background:transparent;border-top:1px solid #fff3}.s6 .head{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 28%,var(--bg)) 0 42%,var(--bg) 42% 58%,color-mix(in srgb,var(--b) 28%,var(--bg)) 58%)}.s7 .head,.s7 .row,.s7 .foot{background:color-mix(in srgb,var(--bg) 78%,transparent);border:1px solid #fff3}.s8 .head{clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%,3% 50%)}.s8 .row{margin:0 14px}.s8 .foot{margin-left:28px;margin-right:28px}.edit{outline:5px solid #ff2525;outline-offset:-5px;-webkit-app-region:drag}
</style></head><body><div id=o><div class=shell><div class=head><div id=ta class="team left"></div><div class=center><div id=set class=set></div><div class=score><span id=sa></span> : <span id=sb></span></div></div><div id=tb class=team></div></div><div id=rows class=rows></div><div id=foot class=foot></div></div></div><script>
const o=document.getElementById('o');function draw(S){const s=S.match;o.className='s'+(+s.style+1);for(const[k,v]of Object.entries({'--a':s.colorA,'--b':s.colorB,'--bg':s.bg,'--panel':s.panel,'--text':s.text,'--muted':s.muted,'--pad':s.padding+'px','--hh':s.headerH+'px','--rh':s.rowH+'px','--gap':s.gap+'px','--ts':s.teamSize+'px','--ss':s.scoreSize+'px'}))o.style.setProperty(k,v);ta.textContent=s.teamA;tb.textContent=s.teamB;sa.textContent=s.scoreA;sb.textContent=s.scoreB;set.textContent=s.setText;rows.innerHTML='';s.rows.filter(x=>x.show).forEach(x=>{const d=document.createElement('div');d.className='row';d.innerHTML='<div class=label></div><div class="val va"></div><div class="val vb"></div>';d.children[0].textContent=x.label;d.children[1].textContent=x.a;d.children[2].textContent=x.b;rows.appendChild(d)});foot.textContent=s.footer;foot.style.display=s.footerShow?'flex':'none'}async function tick(){try{draw(await fetch('/state?'+Date.now(),{cache:'no-store'}).then(r=>r.json()))}catch{}}tick();setInterval(tick,150);</script></body></html>
