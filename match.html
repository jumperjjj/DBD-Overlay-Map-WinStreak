<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Segoe UI,Arial;color:#fff}#root{position:relative;width:100%;height:200px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}.shell{flex:1;min-width:0;filter:drop-shadow(0 6px 7px #0009)}.killerCard{display:none;position:relative;flex:0 0 112px;align-self:center;flex-direction:column;background:#0b0e14dd;border-radius:6px;overflow:hidden;box-shadow:0 5px 7px #0008}.killerCard img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center;background:transparent;padding:5px 3px 6px}.killerName{position:absolute;left:0;right:0;bottom:0;height:22px;padding:3px 4px;text-align:center;font-size:10px;font-weight:900;background:linear-gradient(180deg,transparent,#05070bd9 40%);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}.leftK .killerCard{order:0}.leftK .shell{order:1}.rightK .shell{order:0}.rightK .killerCard{order:1}.head{height:62px;display:grid;grid-template-columns:1fr 112px 1fr;align-items:center;background:var(--bg);border:1px solid #ffffff22}.team{font-family:var(--team-font);font-size:21px;font-weight:900;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamA{text-align:right}.teamB{text-align:left}.center{text-align:center}.set{font-family:var(--set-font);font-size:9px;font-weight:900;letter-spacing:1.5px;color:var(--set-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-family:var(--score-font);font-size:31px;font-weight:900;line-height:1}.rows{display:flex;flex-direction:column;gap:4px;margin-top:4px}.row{height:29px;display:grid;grid-template-columns:124px 1fr;align-items:center;background:var(--panel);border-left:4px solid var(--row-color)}.label{height:100%;display:flex;align-items:center;padding:0 8px;background:#0003;color:var(--row-color);font-size:10px;font-weight:900}.rowText{padding:0 10px;font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{height:22px;margin-top:4px;padding:0 10px;display:flex;align-items:center;justify-content:flex-start;background:var(--footer-bg);color:var(--footer-color);font-size:10px;font-weight:900;letter-spacing:1px}
/* 1 Frame Rail */
.theme-0 .head{border:0;border-left:5px solid var(--a);border-right:5px solid var(--b);box-shadow:inset 0 -1px #ffffff22}.theme-0 .team{font-style:italic}.theme-0 .center{height:100%;display:flex;flex-direction:column;justify-content:center;background:#111722;border-left:1px solid #ffffff1a;border-right:1px solid #ffffff1a}.theme-0 .row{border-left:5px solid var(--row-color)}.theme-0 .footer{border-right:4px solid var(--b)}.theme-0 .killerCard{border:0}
/* 2 Dark Bar */
.theme-1 .head{border:0;border-bottom:1px solid #ffffff24;background:linear-gradient(180deg,#0b0e14f2,#171c25e8)}.theme-1 .row{border-left:0;border-bottom:1px solid #ffffff18;background:#0b0e14d9}.theme-1 .label{background:linear-gradient(90deg,color-mix(in srgb,var(--row-color) 25%,#080a0f),#080a0f)}.theme-1 .killerCard{border:0;background:linear-gradient(180deg,#0b0e14f2,#171c25e8)}
/* 3 Split Center — rebuilt */
.theme-2 .head{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 18%,#0b0e14),#0b0e14 28% 72%,color-mix(in srgb,var(--b) 18%,#0b0e14));border:1px solid #ffffff1d;border-radius:6px;overflow:hidden}
.theme-2 .team{height:100%;display:flex;align-items:center;background:#0b0e14d8}
.theme-2 .teamA{justify-content:flex-end;border-right:1px solid #ffffff16}
.theme-2 .teamB{justify-content:flex-start;border-left:1px solid #ffffff16}
.theme-2 .center{height:100%;display:flex;flex-direction:column;justify-content:center;background:#06080de8;border-left:2px solid var(--a);border-right:2px solid var(--b);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
.theme-2 .rows{gap:5px;margin-top:5px}
.theme-2 .row{border:0;border-radius:6px;background:linear-gradient(90deg,#0a0d13e8,#121722d6);overflow:hidden}
.theme-2 .label{background:color-mix(in srgb,var(--row-color) 16%,#0a0d13);border-left:4px solid var(--row-color)}
.theme-2 .footer{background:#090c12d9;border:1px solid #ffffff14;border-radius:0 0 6px 6px}
.theme-2 .killerCard{background:#090c12e8;border:1px solid #ffffff1a;border-radius:6px}
/* 4 Slanted */
.theme-3 .head,.theme-3 .row,.theme-3 .footer{clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}.theme-3 .killerCard{clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
/* 5 Panels */
.theme-4 .head{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 18%,#090b10),#090b10 45%,#090b10 55%,color-mix(in srgb,var(--b) 18%,#090b10));border:1px solid #ffffff1f;border-radius:3px}.theme-4 .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px}.theme-4 .row{grid-template-columns:82px 1fr;border:1px solid #ffffff16;border-top:2px solid var(--row-color);background:#0a0c11dc}.theme-4 .label{font-size:8px}.theme-4 .footer{justify-content:center;border:1px solid #ffffff14}
/* 6 Corner Cut */
.theme-5 .head{border:1px solid #ffffff20;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}.theme-5 .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px}.theme-5 .row{grid-template-columns:78px 1fr;border:1px solid #ffffff14;border-left:3px solid var(--row-color);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}.theme-5 .label{font-size:8px;background:transparent}.theme-5 .killerCard{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
/* 7 Score Deck */
.theme-6 .head{background:transparent;border:0;position:relative}.theme-6 .head:before{content:'';position:absolute;inset:6px 18px 0;background:#0a0d13e8;border-top:2px solid var(--a);border-bottom:2px solid var(--b);clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);z-index:-1}.theme-6 .center{background:#06080ddf;border:1px solid #ffffff24;border-radius:4px;padding:4px 8px}.theme-6 .row{border:0;border-bottom:2px solid color-mix(in srgb,var(--row-color) 65%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--row-color) 13%,#0a0d13),#0a0d13 42%)}.theme-6 .label{background:transparent}.theme-6 .footer{justify-content:center;border-radius:0 0 8px 8px}
/* 8 Twin Wing */
.theme-7 .head{background:transparent;border:0;gap:7px}.theme-7 .team{height:52px;display:flex;align-items:center;background:#0a0d13e8;border-bottom:3px solid currentColor}.theme-7 .teamA{justify-content:flex-end;color:var(--a);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}.theme-7 .teamB{color:var(--b);clip-path:polygon(10px 0,100% 0,100% 100%,0 100%)}.theme-7 .center{background:#05070be8;border:1px solid #ffffff26;border-radius:8px;padding:4px 6px}.theme-7 .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px}.theme-7 .row{grid-template-columns:82px 1fr;border:0;border-left:3px solid var(--row-color);border-radius:7px;background:#0a0d13d9}.theme-7 .label{font-size:8px;background:#ffffff08}.theme-7 .footer{justify-content:center;background:transparent;border-top:1px solid #ffffff20}.theme-7 .killerCard{border-radius:8px}

/* 9 Centerline */
.theme-8 .head{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 13%,#0b0e14),#0b0e14 43%,#0b0e14 57%,color-mix(in srgb,var(--b) 13%,#0b0e14));border:0;border-top:1px solid #ffffff20;border-bottom:1px solid #ffffff20}
.theme-8 .center{height:100%;display:flex;flex-direction:column;justify-content:center;border-left:2px solid var(--a);border-right:2px solid var(--b);background:#07090ed9}
.theme-8 .row{border-left:0;border-bottom:2px solid color-mix(in srgb,var(--row-color) 60%,transparent);background:#0b0e14dd}
.theme-8 .label{background:linear-gradient(90deg,color-mix(in srgb,var(--row-color) 18%,#0b0e14),transparent)}
.theme-8 .footer{justify-content:center;border-top:1px solid #ffffff1b}
.theme-8 .killerCard{background:#0b0e14dd;border-top:1px solid #ffffff20;border-bottom:1px solid #ffffff20}
/* 10 Bracket HUD */
.theme-9 .head{background:#090c12e8;border:0;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%,0 12px)}
.theme-9 .head:after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 3px 0 var(--a),inset -3px 0 var(--b)}
.theme-9 .rows{gap:5px}
.theme-9 .row{background:#090c12dc;border:1px solid #ffffff15;border-left:0;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.theme-9 .label{background:#ffffff08;border-left:3px solid var(--row-color)}
.theme-9 .footer{background:#090c12c8;border-left:2px solid var(--a);border-right:2px solid var(--b);justify-content:center}
.theme-9 .killerCard{background:#090c12e8;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}

.handle{display:none;position:absolute;z-index:30;width:16px;height:16px}.edit .handle{display:block}.nw{left:0;top:0;cursor:nwse-resize}.ne{right:0;top:0;cursor:nesw-resize}.sw{left:0;bottom:0;cursor:nesw-resize}.se{right:0;bottom:0;cursor:nwse-resize}.edit{cursor:move}
</style></head><body><div id="root"><div id="killerCard" class="killerCard"><img id="killerImg"><div id="killerName" class="killerName"></div></div><div id="shell" class="shell"><div class="head"><div id="teamA" class="team teamA"></div><div class="center"><div id="setText" class="set"></div><div class="score"><span id="scoreA"></span><span id="separator"> : </span><span id="scoreB"></span></div></div><div id="teamB" class="team teamB"></div></div><div id="rows" class="rows"></div><div id="footer" class="footer"></div></div><i class="handle nw" data-edge="nw"></i><i class="handle ne" data-edge="ne"></i><i class="handle sw" data-edge="sw"></i><i class="handle se" data-edge="se"></i></div><script>
const root=document.getElementById('root'),shell=document.getElementById('shell'),killerCard=document.getElementById('killerCard'),killerImg=document.getElementById('killerImg'),killerName=document.getElementById('killerName');
const teamA=document.getElementById('teamA'),teamB=document.getElementById('teamB'),scoreA=document.getElementById('scoreA'),scoreB=document.getElementById('scoreB'),separator=document.getElementById('separator'),setText=document.getElementById('setText'),rows=document.getElementById('rows'),footer=document.getElementById('footer');
function draw(S){const s=S.match;root.className='theme-'+Math.max(0,Math.min(9,+s.style||0))+(s.killerImage?(s.killerLeft?' leftK':' rightK'):'');root.style.setProperty('--a',s.colorA);root.style.setProperty('--b',s.colorB);root.style.setProperty('--bg',s.bg);root.style.setProperty('--panel',s.panel);root.style.setProperty('--text',s.text);root.style.setProperty('--set-color',s.setColor||'#d7dce5');root.style.setProperty('--footer-color',s.footerColor||'#f2f2f2');root.style.setProperty('--footer-bg',s.footerBg||s.bg);root.style.setProperty('--team-font',s.fontName||'Segoe UI');root.style.setProperty('--score-font',s.fontNumber||'Segoe UI');root.style.setProperty('--set-font',s.fontSet||'Segoe UI');teamA.textContent=s.teamA||'TIME A';teamB.textContent=s.teamB||'TIME B';scoreA.textContent=String(Math.max(0,Number(s.scoreA)||0));scoreB.textContent=String(Math.max(0,Number(s.scoreB)||0));separator.style.color=s.scoreSepColor||'#f2f2f2';teamA.style.color=s.colorA;teamB.style.color=s.colorB;scoreA.style.color=s.colorA;scoreB.style.color=s.colorB;document.querySelector('.head').style.boxShadow=s.edgeBorder?`inset 3px 0 ${s.colorA}, inset -3px 0 ${s.colorB}`:'';document.querySelector('.head').style.boxShadow=s.edgeBorder?`inset 3px 0 ${s.colorA}, inset -3px 0 ${s.colorB}`:'none';setText.textContent=s.setText||'';const glow=Math.max(0,Math.min(100,+s.glow||0))/100*8;teamA.style.textShadow=glow?`0 0 ${glow}px ${s.colorA}`:'none';teamB.style.textShadow=glow?`0 0 ${glow}px ${s.colorB}`:'none';scoreA.style.textShadow=glow?`0 0 ${glow}px ${s.colorA}`:'none';scoreB.style.textShadow=glow?`0 0 ${glow}px ${s.colorB}`:'none';rows.innerHTML='';(s.rows||[]).filter(r=>r.show).forEach(r=>{const d=document.createElement('div');d.className='row';d.style.setProperty('--row-color',r.color||s.colorA);const l=document.createElement('div');l.className='label';l.textContent=r.label||'';const t=document.createElement('div');t.className='rowText';t.textContent=r.text||'';d.append(l,t);rows.appendChild(d)});footer.style.display=s.footerShow?'flex':'none';footer.style.justifyContent=s.footerCenter?'center':'flex-start';footer.textContent=s.footer||'';root.classList.toggle('rightK',!!s.killerImage&&!s.killerLeft);root.classList.toggle('leftK',!!s.killerImage&&!!s.killerLeft);if(s.killerImage){killerCard.style.display='flex';const url='http://127.0.0.1:17384/killer?name='+encodeURIComponent(s.killerImage);if(killerImg.dataset.src!==url){killerImg.dataset.src=url;killerImg.src=url}killerName.textContent=s.showKillerName?(s.killerName||''):'';killerName.style.display=s.showKillerName&&s.killerName?'block':'none';requestAnimationFrame(()=>{const sh=Math.max(1,Math.round(shell.getBoundingClientRect().height));if(killerCard.style.height!==sh+'px')killerCard.style.height=sh+'px'})}else{killerCard.style.display='none';killerImg.dataset.src=''}}
api.get().then(x=>draw(x.state));api.onState(draw);
let editMode=false;api.onEdit(v=>{editMode=v;root.classList.toggle('edit',v)});
root.addEventListener('pointerdown',e=>{if(!editMode||e.target.closest('.handle'))return;e.preventDefault();root.setPointerCapture?.(e.pointerId);api.dragStart('match',{x:e.screenX,y:e.screenY})});root.addEventListener('pointermove',e=>{if(editMode&&root.hasPointerCapture?.(e.pointerId))api.dragMove({x:e.screenX,y:e.screenY})});function endDrag(e){if(root.hasPointerCapture?.(e.pointerId))root.releasePointerCapture?.(e.pointerId);api.dragEnd()}root.addEventListener('pointerup',endDrag);root.addEventListener('pointercancel',endDrag);
document.querySelectorAll('.handle').forEach(el=>el.addEventListener('pointerdown',e=>{if(!editMode)return;e.stopPropagation();e.preventDefault();el.setPointerCapture?.(e.pointerId);api.resizeStart('match',el.dataset.edge,{x:e.screenX,y:e.screenY});const mv=ev=>api.resizeMove({x:ev.screenX,y:ev.screenY});const up=ev=>{el.releasePointerCapture?.(ev.pointerId);el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);api.resizeEnd()};el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}));
</script></body></html>
