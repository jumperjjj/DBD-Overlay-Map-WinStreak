<!doctype html><html><head><meta charset=utf-8><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial}#o{width:100%;height:100%;padding:var(--pad);color:var(--text);position:relative;display:flex;align-items:center;justify-content:center}.shell{width:100%}.hasKiller .shell{width:calc(100% - 140px)}.hasKiller.leftK .shell{margin-left:140px}.hasKiller.rightK .shell{margin-right:140px}.shell{filter:drop-shadow(0 7px 8px #000b);position:relative}.killerCard{display:none;position:absolute;top:50%;transform:translateY(-50%);width:132px;text-align:center;background:var(--bg);border:1px solid #ffffff22;overflow:hidden;pointer-events:none;z-index:4;box-shadow:0 7px 8px #0008}.killerCard img{display:block;width:100%;height:calc(100% - 22px);object-fit:contain;object-position:center bottom;background:transparent;padding:3px}.hasKiller.leftK .killerCard{left:var(--pad)}.hasKiller.rightK .killerCard{right:var(--pad)}.killerName{padding:3px 2px;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000,0 0 5px #000;color:#fff;background:transparent}.head{height:var(--hh);display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;background:var(--bg);border:1px solid #fff2}.team{font-family:var(--fontName,'Segoe UI');font-size:var(--ts);font-weight:900;padding:0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.left{text-align:right}.center{text-align:center}.set{color:var(--setColor);font-family:var(--fontSet,'Segoe UI');font-size:10px;letter-spacing:1.7px;font-weight:800}.score{font-family:var(--fontNumber,'Segoe UI');font-size:var(--ss);font-weight:900;line-height:1}.rows{display:flex;flex-direction:column;gap:var(--gap);margin-top:var(--gap)}.row{height:var(--rh);display:grid;grid-template-columns:190px 1fr;align-items:center;background:var(--panel);border-left:4px solid var(--rc);border-right:0}.label{height:100%;display:flex;align-items:center;padding:0 10px;backgrou /* 1. Frame Rail — novo estilo: cabeçalho em trilho, centro destacado e INFOs em placas */
.s1 .head{background:#0a0d12e8;border:0;border-left:5px solid var(--a);border-right:5px solid var(--b);box-shadow:inset 0 -1px #ffffff22}

.s1 .center{align-self:stretch;display:flex;flex-direction:column;justify-content:center;background:#111722;border-left:1px solid #ffffff1c;border-right:1px solid #ffffff1c}
.s1 .rows{gap:3px;margin-top:4px}
.s1 .row{background:#0b0e14e6;border:0;border-left:5px solid var(--rc)}
.s1 .label{background:color-mix(in srgb,var(--rc) 14%,#0b0e14);clip-path:polygon(0 0,94% 0,100% 50%,94% 100%,0 100%)}
.s1 .foot{background:#0b0e14c9;border:0;border-right:4px solid var(--b);letter-spacing:1.2px}

/* 2. Dark Bar — sem linha azul/superior */
.s2 .head{background:linear-gradient(180deg,#0b0e14f2,#171c25e8);border:0;border-bottom:1px solid #ffffff24}
.s2 .row{background:#0b0e14d9;border-left:0;border-bottom:1px solid #ffffff18}
.s2 .label{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 25%,#080a0f),#080a0f);border-right:1px solid #ffffff18}

.s3 .head{background:transparent;border:0;border-bottom:3px solid #ffffff24}.s3 .team{letter-spacing:2px}.s3 .center{background:#090b10d9;padding:7px 14px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}.s3 .rows{gap:6px;margin-top:8px}.s3 .row{background:linear-gradient(90deg,#090b10e8,#151922c7);border-left:0;border-radius:5px}.s3 .label{background:transparent;border-left:3px solid var(--rc)}.s3 .foot{background:transparent;border-top:1px solid #ffffff26;padding-left:4px}
.s4 .head,.s4 .row,.s4 .foot{clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}.s5 .head{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 22%,#090b10),#090b10 45%,#090b10 55%,color-mix(in srgb,var(--b) 22%,#090b10));border:1px solid #ffffff1f;border-radius:3px}.s5 .center{border-left:1px solid #ffffff1f;border-right:1px solid #ffffff1f}.s5 .rows{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.s5 .row{grid-template-columns:100px 1fr;height:var(--rh);border:1px solid #ffffff16;border-top:2px solid var(--rc);background:#0a0c11dc}.s5 .label{font-size:9px;background:#0004}.s5 .foot{justify-content:center;background:#0a0c11c9;border:1px solid #ffffff14;letter-spacing:1.4px}


/* 6. Corner Cut — cabeçalho compacto + INFOs alternadas */
.s6 .head{background:#0a0d13e8;border:1px solid #ffffff20;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px)}

.s6 .foot{justify-content:center;background:#0a0d13c9;border-left:1px solid #ffffff18;border-right:1px solid #ffffff18;letter-spacing:1.5px}

/* 7. Score Deck — cabeçalho central elevado, INFOs como cartões horizontais */
.s7 .head{height:calc(var(--hh) + 4px);background:transparent;border:0;position:relative}
.s7 .head:before{content:'';position:absolute;inset:7px 22px 0;background:#0a0d13e8;border-top:2px solid var(--a);border-bottom:2px solid var(--b);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);z-index:-1}

.s7 .row{background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 13%,#0a0d13),#0a0d13 42%);border:0;border-bottom:2px solid color-mix(in srgb,var(--rc) 65%,transparent);border-radius:2px}
.s7 .label{background:transparent;letter-spacing:1px}
.s7 .foot{justify-content:center;background:#06080dc7;border-radius:0 0 8px 8px;letter-spacing:1.5px}

/* 8. Twin Wing — lados dos times separados, placar flutuante, INFOs em duas colunas */
.s8 .head{background:transparent;border:0;gap:8px}
.s8 .team{height:calc(var(--hh) - 10px);display:flex;align-items:center;background:#0a0d13e8;border-bottom:3px solid currentColor}
.s8 .team.left{justify-content:flex-end;color:var(--a);clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.s8 .team:not(.left){color:var(--b);clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
.s8 .center{background:#05070be8;border:1px solid #ffffff26;border-radius:8px;padding:5px 7px;box-shadow:0 4px 10px #0008}
.s8 .rows{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}
.s8 .row{grid-template-columns:92px 1fr;background:#0a0d13d9;border:0;border-left:3px solid var(--rc);border-radius:8px}
.s8 .label{background:#ffffff08;border-radius:8px 0 0 8px;font-size:9px}
.s8 .foot{justify-content:center;background:transparent;border-top:1px solid #ffffff20}
.s7~.killerCard,.s7 .killerCard{background:#0a0d13e8;border-top:2px solid var(--a);border-bottom:2px solid var(--b);clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.s8~.killerCard,.s8 .killerCard{background:#05070be8;border:1px solid #ffffff26;border-radius:8px;box-shadow:0 4px 10px #0008}
.s1~.killerCard,.s1 .killerCard{background:#0a0d12e8;border:0}
.s6~.killerCard,.s6 .killerCard{background:#0a0d13e8;border:1px solid #ffffff20;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.s2~.killerCard,.s2 .killerCard{background:linear-gradient(180deg,#0b0e14f2,#171c25e8);border:0}
.s3~.killerCard,.s3 .killerCard{background:#090b10d9;border:0;border-bottom:3px solid #ffffff24;border-radius:5px}
.s4~.killerCard,.s4 .killerCard{clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.s5~.killerCard,.s5 .killerCard{background:linear-gradient(180deg,color-mix(in srgb,var(--a) 16%,#090b10),#090b10);border:1px solid #ffffff1f;border-radius:3px}
.edit.edit{-webkit-app-region:no-drag;cursor:move}
.handle{display:none;position:fixed;z-index:9999;-webkit-app-region:no-drag}.edit .handle{display:block}
.h-n,.h-s{left:8px;right:8px;height:8px;cursor:ns-resize}.h-n{top:0}.h-s{bottom:0}
.h-e,.h-w{top:8px;bottom:8px;width:8px;cursor:ew-resize}.h-e{right:0}.h-w{left:0}
.h-ne,.h-nw,.h-se,.h-sw{width:14px;height:14px}.h-ne{right:0;top:0;cursor:nesw-resize}.h-nw{left:0;top:0;cursor:nwse-resize}.h-se{right:0;bottom:0;cursor:nwse-resize}.h-sw{left:0;bottom:0;cursor:nesw-resize}
</style></head><body><div id=o><div id=killerCard class=killerCard><img id=killerImg><div id=killerName class=killerName></div></div><div id=shell class=shell><div class=head><div id=ta class="team left"></div><div class=center><div id=set class=set></div><div class=score><span id=sa></span> : <span id=sb></span></div></div><div id=tb class=team></div></div><div id=rows class=rows></div><div id=foot class=foot></div></div></div><div class="handle h-n" data-edge=n></div><div class="handle h-s" data-edge=s></div><div class="handle h-e" data-edge=e></div><div class="handle h-w" data-edge=w></div><div class="handle h-ne" data-edge=ne></div><div class="handle h-nw" data-edge=nw></div><div class="handle h-se" data-edge=se></div><div class="handle h-sw" data-edge=sw></div><script>
const o=document.getElementById('o');function draw(S){const s=S.match;o.className='s'+(+s.style+1);for(const[k,v]of Object.entries({'--a':s.colorA,'--b':s.colorB,'--bg':s.bg,'--panel':s.panel,'--text':s.text,'--muted':s.muted,'--pad':s.padding+'px','--hh':s.headerH+'px','--rh':s.rowH+'px','--gap':s.gap+'px','--ts':s.teamSize+'px','--ss':s.scoreSize+'px','--fontSet':s.fontSet||'Segoe UI'}))o.style.setProperty(k,v);ta.textContent=s.teamA;tb.textContent=s.teamB;sa.textContent=s.scoreA;sb.textContent=s.scoreB;ta.style.color=s.colorA;tb.style.color=s.colorB;sa.style.color=s.colorA;sb.style.color=s.colorB;

const glow=Math.max(0,Math.min(100,+s.glow||0))/100,blur=glow?2+glow*13:0;

sa.style.color=s.colorA;sb.style.color=s.colorB;sa.style.textShadow=glow?`0 0 ${blur}px ${s.colorA}`:'none';sb.style.textShadow=glow?`0 0 ${blur}px ${s.colorB}`:'none';set.textContent=s.setText;rows.innerHTML='';const shown=false?[
 {show:true,label:'RESULT',a:s.autoUseFresh?`${s.autoStages} Stages ${s.autoFresh} Fresh`:`${s.autoStages} Stages`,b:'',color:s.rows[0]?.color||s.colorA},
 {show:true,label:'WINCON',a:s.autoUseFresh?(+s.autoFresh<4?`${s.autoStages} Stages ${+s.autoFresh+1} Fresh`:`${+s.autoStages+1} Stages`):`${+s.autoStages+1} Stages`,b:'',color:s.rows[1]?.color||s.colorB}
]:s.rows;shown.filter(x=>x.show).forEach(x=>{const d=document.createElement('div');d.className='row';d.style.setProperty('--rc',x.color||s.colorA);d.innerHTML='<div class=label></div><div class="val va"></div>';d.children[0].textContent=x.label;d.children[0].style.color=x.color||s.colorA;d.children[1].textContent=x.a;rows.appendChild(d)});foot.textContent=s.footer;foot.style.display=s.footerShow?'flex':'none';foot.style.color=s.footerColor||'#aeb6c2';foot.style.background=s.footerBg||s.panel;foot.style.justifyContent=s.footerCenter?'center':'flex-start';

const head=document.querySelector('.head'),teamEls=document.querySelectorAll('.team'),scoreEl=document.querySelector('.score');
head.style.height=(+s.headerH||64)+'px';o.style.padding=(+s.padding||0)+'px';rows.style.gap=(+s.gap||0)+'px';rows.style.marginTop=(+s.gap||0)+'px';foot.style.marginTop=(+s.gap||0)+'px';
teamEls.forEach(el=>el.style.fontSize=(+s.teamSize||22)+'px');if(scoreEl)scoreEl.style.fontSize=(+s.scoreSize||34)+'px';
rows.querySelectorAll('.row').forEach(el=>el.style.height=(+s.rowH||28)+'px');
o.classList.toggle('hasKiller',!!s.killerImage);o.classList.toggle('leftK',!!s.killerImage&&!!s.killerLeft);o.classList.toggle('rightK',!!s.killerImage&&!s.killerLeft);
killerCard.style.display=s.killerImage?'block':'none';killerImg.src=s.killerImage?('http://127.0.0.1:17384/killer?name='+encodeURIComponent(s.killerImage)):'';
requestAnimationFrame(()=>{killerCard.style.height=Math.max(70,shell.getBoundingClientRect().height)+'px'});
killerName.textContent=s.killerName||'';killerName.style.display=s.showKillerName&&s.killerName?'block':'none';
}api.get().then(x=>draw(x.state));api.onState(draw);let editMode=false;api.onEdit(x=>{editMode=x;o.classList.toggle('edit',x)});
o.addEventListener('pointerdown',e=>{if(!editMode||e.target.closest('.handle'))return;e.preventDefault();o.setPointerCapture?.(e.pointerId);api.dragStart('match',{x:e.screenX,y:e.screenY})});
o.addEventListener('pointermove',e=>{if(editMode&&o.hasPointerCapture?.(e.pointerId))api.dragMove({x:e.screenX,y:e.screenY})});
function endDrag(e){if(o.hasPointerCapture?.(e.pointerId))o.releasePointerCapture?.(e.pointerId);api.dragEnd()}o.addEventListener('pointerup',endDrag);o.addEventListener('pointercancel',endDrag);
