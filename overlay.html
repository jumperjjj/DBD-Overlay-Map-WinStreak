<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#o{position:absolute;left:50%;top:50%;width:380px;height:120px;transform-origin:center;--a:#d7b84a;--nc:#fff;--vc:#d7b84a;--nf:'Segoe UI';--vf:Impact;--name-size:18px;--number-size:58px}
.bg{position:absolute;inset:0;z-index:0;opacity:var(--bg-opacity,1);pointer-events:none}
.decor{position:absolute;inset:0;z-index:1;pointer-events:none}
.name,.value{position:relative;z-index:2;color:var(--nc);font-family:var(--nf);white-space:nowrap}
.value{color:var(--vc)!important;font-family:var(--vf);font-size:var(--number-size)!important;line-height:1;font-weight:800;letter-spacing:var(--number-spacing,0px)}
.name{font-size:var(--name-size)!important;font-weight:var(--name-weight,700)!important;letter-spacing:var(--letter-spacing,0px)}
.nameShift{transform:translateX(var(--name-x,0px))!important}.valueShift{transform:translateX(var(--number-x,0px))!important}
.shadow-on{filter:drop-shadow(0 8px 7px rgba(0,0,0,.95)) drop-shadow(0 0 7px rgba(0,0,0,.8))}

/* 1 Classic Arrow */
.s1{display:flex;align-items:center;justify-content:center;gap:26px}.s1 .bg{background:var(--box1);clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,6% 50%)}.s1 .decor{border-left:5px solid var(--a);clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%,6% 50%)}.s1 .name{max-width:220px;overflow:hidden;text-overflow:ellipsis}
/* 2 Neon */
.s2{display:flex;align-items:center;justify-content:center;gap:30px}.s2 .bg{inset:7px;background:var(--box1);border:2px solid var(--a);box-shadow:inset 0 0 18px color-mix(in srgb,var(--a) 30%,transparent);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}.s2 .decor{inset:14px;border-top:1px solid var(--a);border-bottom:1px solid var(--a)}
/* 3 Score Tab - deliberately compact, no giant box */
.s3{display:flex;align-items:center;justify-content:center;gap:18px}.s3 .bg{left:42px;right:42px;top:24px;bottom:24px;background:var(--box1);border-radius:10px;border-bottom:4px solid var(--a)}.s3 .name{padding:7px 12px}.s3 .value{min-width:68px;text-align:center}
/* 4 Blood Slash */
.s4{display:flex;align-items:center;justify-content:center;gap:22px}.s4 .bg{inset:13px 18px;background:linear-gradient(105deg,var(--box2),var(--box1) 68%);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}.s4 .decor:after{content:'///';position:absolute;left:42px;top:45px;color:var(--a);font-weight:900}
/* 5 Badge */
.s5{display:flex;align-items:center;justify-content:center;gap:22px}.s5 .bg{left:50px;right:50px;top:10px;bottom:10px;background:var(--box1);border:3px solid var(--a);border-radius:55px}.s5 .value{border:2px solid var(--a);border-radius:50%;width:82px;height:82px;display:grid;place-items:center}
/* 6 Glass */
.s6{display:flex;align-items:center;justify-content:center;gap:28px}.s6 .bg{inset:17px 22px;background:color-mix(in srgb,var(--box1) 82%,transparent);border:1px solid rgba(255,255,255,.38);border-radius:30px}.s6 .decor{inset:22px 30px;border-left:3px solid var(--a);border-radius:25px}
/* 7 Arcade */
.s7{display:grid;grid-template-columns:1fr 105px;align-items:center;padding:0 55px}.s7 .bg{inset:13px 34px;background:var(--box1);border:4px double var(--a);box-shadow:5px 5px 0 #000}.s7 .name{text-align:center}.s7 .value{text-align:center}
/* 8 Broadcast */
.s8{display:grid;grid-template-columns:1fr 105px;align-items:center;padding:0 38px}.s8 .bg{inset:25px 20px;background:var(--box1)}.s8 .decor{left:20px;right:20px;top:25px;bottom:25px;border-left:9px solid var(--a);border-right:2px solid var(--a)}.s8 .name{padding-left:12px}.s8 .value{text-align:center}
/* 9 Cyber */
.s9{display:flex;align-items:center;justify-content:center;gap:30px}.s9 .bg{inset:13px 18px;background:var(--box1);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);border-top:3px solid var(--a);border-bottom:3px solid var(--a)}.s9 .decor:before{content:'';position:absolute;left:54px;top:26px;width:28px;height:4px;background:var(--a)}
/* 10 Elegant */
.s10{display:flex;align-items:center;justify-content:center;gap:30px}.s10 .bg{inset:18px 30px;background:var(--box1);border-top:1px solid var(--a);border-bottom:1px solid var(--a);border-radius:3px}.s10 .decor:before,.s10 .decor:after{content:'◆';position:absolute;top:48px;color:var(--a);font-size:16px}.s10 .decor:before{left:42px}.s10 .decor:after{right:42px}
/* 11 Minimal line */
.s11{display:flex;align-items:center;justify-content:center;gap:24px}.s11 .bg{left:42px;right:42px;top:31px;bottom:31px;background:var(--box1);border-left:4px solid var(--a)}.s11 .name{padding-left:10px}
/* 12 Hex */
.s12{display:flex;align-items:center;justify-content:center;gap:24px}.s12 .bg{inset:12px 28px;background:var(--box1);clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%)}.s12 .decor{inset:18px 38px;border-top:2px solid var(--a);border-bottom:2px solid var(--a)}
/* 13 Split */
.s13{display:grid;grid-template-columns:1fr 92px;align-items:center;padding:0 52px}.s13 .bg{inset:18px 34px;background:var(--box1);border-radius:8px}.s13 .decor{left:274px;top:18px;bottom:18px;width:3px;background:var(--a)}.s13 .name{text-align:center}.s13 .value{text-align:center}
/* 14 Razor */
.s14{display:flex;align-items:center;justify-content:center;gap:28px}.s14 .bg{inset:16px 24px;background:var(--box1);clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,8% 50%)}.s14 .decor{left:45px;right:45px;top:20px;border-top:3px solid var(--a)}

.editing{outline:5px solid #ff2020!important;outline-offset:-5px!important}
.handle{display:none;position:absolute;z-index:9999;background:#ff2020;border:2px solid #fff;width:14px;height:14px}
.editing .handle{display:block}
.handle.nw{left:-2px;top:-2px;cursor:nwse-resize}.handle.ne{right:-2px;top:-2px;cursor:nesw-resize}.handle.sw{left:-2px;bottom:-2px;cursor:nesw-resize}.handle.se{right:-2px;bottom:-2px;cursor:nwse-resize}
.handle.n{left:50%;top:-2px;transform:translateX(-50%);cursor:ns-resize}.handle.s{left:50%;bottom:-2px;transform:translateX(-50%);cursor:ns-resize}.handle.w{left:-2px;top:50%;transform:translateY(-50%);cursor:ew-resize}.handle.e{right:-2px;top:50%;transform:translateY(-50%);cursor:ew-resize}

.editing{-webkit-app-region:drag}
.editing .handle{-webkit-app-region:no-drag}
</style></head>
<body><div id="o"><div class="bg"></div><div class="decor"></div><div id="n" class="name nameShift"></div><div id="v" class="value valueShift"></div>
<div class="handle nw" data-edge="nw"></div><div class="handle n" data-edge="n"></div><div class="handle ne" data-edge="ne"></div><div class="handle e" data-edge="e"></div><div class="handle se" data-edge="se"></div><div class="handle s" data-edge="s"></div><div class="handle sw" data-edge="sw"></div><div class="handle w" data-edge="w"></div></div>
<script>
const o=document.getElementById('o'),n=document.getElementById('n'),v=document.getElementById('v');
function draw(s){
 o.className='s'+((+s.style||0)+1)+(s.shadow?' shadow-on':'');
 o.style.setProperty('--a',s.accent);o.style.setProperty('--box1',s.boxColor||'#15191f');o.style.setProperty('--box2',s.boxColor2||'#09090b');o.style.setProperty('--nc',s.nameColor);o.style.setProperty('--vc',s.numberColor);
 o.style.setProperty('--nf',s.nameFont);o.style.setProperty('--vf',s.numberFont);
 o.style.setProperty('--name-size',s.nameFontSize+'px');o.style.setProperty('--number-size',s.numberFontSize+'px');
 o.style.setProperty('--name-x',(s.nameOffsetX||0)+'px');o.style.setProperty('--number-x',(s.numberOffsetX||0)+'px');
 o.style.setProperty('--name-weight',s.nameBold?'900':'400');o.style.setProperty('--bg-opacity',String(s.bgOpacity??1));
 o.style.setProperty('--letter-spacing',(s.letterSpacing||0)+'px');o.style.setProperty('--number-spacing',(s.numberSpacing||0)+'px');
 o.style.transform='translate(-50%,-50%)';
 n.textContent=s.nameUpper?String(s.title).toUpperCase():s.title;v.textContent=s.value;v.style.setProperty('color',s.numberColor,'important');
}
api.get().then(x=>draw(x.settings));api.onSettings(draw);api.onEdit(x=>o.classList.toggle('editing',x));
document.querySelectorAll('.handle').forEach(h=>h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();api.resizeStart('streak',h.dataset.edge)}));
window.addEventListener('mouseup',()=>api.resizeEnd());
</script></body></html>
