<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif}
#o{position:absolute;left:50%;top:50%;width:700px;height:110px;transform-origin:center;display:grid;grid-template-columns:1fr 150px 1fr;align-items:center;color:var(--text);--a:#d7b84a;--b:#fff;--bg:#11151b;--text:#fff}
.bg,.decor{position:absolute;inset:0;z-index:0;pointer-events:none}.decor{z-index:1}.side,.mid{position:relative;z-index:2}.side{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800;min-width:0}.left{justify-content:flex-end;text-align:right}.right{justify-content:flex-start}.teamname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font:900 48px Impact,Arial Black,sans-serif;min-width:45px;text-align:center}.mid{text-align:center}.label{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.85}.versus{font:900 20px Arial Black;margin-top:3px}
.t1 .bg{inset:14px 20px;background:var(--bg);clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%)}.t1 .decor{left:20px;right:20px;top:14px;bottom:14px;border-left:7px solid var(--a);border-right:7px solid var(--b)}
.t2 .bg{inset:16px 15px;background:var(--bg);border-radius:38px;border:2px solid rgba(255,255,255,.18)}.t2 .mid{background:var(--bg);border:2px solid var(--a);border-radius:12px;padding:8px}
.t3 .bg{inset:22px 5px;background:var(--bg);border-top:4px solid var(--a);border-bottom:4px solid var(--b)}.t3 .score{font-size:54px}.t3 .mid:before{content:'';position:absolute;left:0;top:-18px;bottom:-18px;width:100%;background:rgba(0,0,0,.35);z-index:-1;transform:skew(-12deg)}
.t4 .bg{inset:10px 28px;background:var(--bg);clip-path:polygon(0 18%,5% 0,95% 0,100% 18%,100% 82%,95% 100%,5% 100%,0 82%)}.t4 .decor:before,.t4 .decor:after{content:'';position:absolute;top:18px;bottom:18px;width:5px}.t4 .decor:before{left:38px;background:var(--a)}.t4 .decor:after{right:38px;background:var(--b)}
.t5 .bg{inset:20px 38px;background:linear-gradient(90deg,color-mix(in srgb,var(--a) 28%,var(--bg)),var(--bg) 40%,var(--bg) 60%,color-mix(in srgb,var(--b) 28%,var(--bg)));border:1px solid rgba(255,255,255,.2)}.t5 .mid{border-left:1px solid var(--a);border-right:1px solid var(--b)}
.editing{outline:5px solid #ff2020;outline-offset:-5px;-webkit-app-region:drag}.handle{display:none;position:absolute;z-index:50;width:14px;height:14px;background:#ff2020;border:2px solid white;-webkit-app-region:no-drag}.editing .handle{display:block}.nw{left:0;top:0;cursor:nwse-resize}.ne{right:0;top:0;cursor:nesw-resize}.sw{left:0;bottom:0;cursor:nesw-resize}.se{right:0;bottom:0;cursor:nwse-resize}.n{left:50%;top:0;cursor:ns-resize}.s{left:50%;bottom:0;cursor:ns-resize}.w{left:0;top:50%;cursor:ew-resize}.e{right:0;top:50%;cursor:ew-resize}
</style></head><body><div id=o><div class=bg></div><div class=decor></div><div class="side left"><span id=an class=teamname></span><span id=as class=score></span></div><div class=mid><div id=lab class=label></div><div class=versus>VS</div></div><div class="side right"><span id=bs class=score></span><span id=bn class=teamname></span></div><i class="handle nw" data-edge=nw></i><i class="handle n" data-edge=n></i><i class="handle ne" data-edge=ne></i><i class="handle e" data-edge=e></i><i class="handle se" data-edge=se></i><i class="handle s" data-edge=s></i><i class="handle sw" data-edge=sw></i><i class="handle w" data-edge=w></i></div><script>
const o=document.getElementById('o');function draw(s){o.className='t'+((+s.teamStyle||0)+1);o.style.setProperty('--a',s.teamColorA);o.style.setProperty('--b',s.teamColorB);o.style.setProperty('--bg',s.teamBg);o.style.setProperty('--text',s.teamText);o.style.transform='translate(-50%,-50%) scale('+(s.team.w/700)+','+(s.team.h/110)+')';an.textContent=s.teamA;bn.textContent=s.teamB;as.textContent=s.teamScoreA;bs.textContent=s.teamScoreB;lab.textContent=s.teamLabel}
api.get().then(x=>draw(x.settings));api.onSettings(draw);api.onEdit(x=>o.classList.toggle('editing',x));document.querySelectorAll('.handle').forEach(h=>h.onmousedown=e=>{e.preventDefault();e.stopPropagation();api.resizeStart('team',h.dataset.edge)});window.onmouseup=()=>api.resizeEnd();
</script></body></html>
