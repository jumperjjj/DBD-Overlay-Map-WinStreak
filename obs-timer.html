<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080,initial-scale=1">
<link rel="stylesheet" href="/timer-render.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}#stage{position:absolute;transform-origin:0 0;display:none}#timerRoot{width:100%;height:100%}
</style></head>
<body><div id="stage"><div id="timerRoot" class="timer-widget"></div></div>
<script src="/timer-render.js"></script>
<script>
const BASES={0:[226,274],1:[258,292],2:[506,110],3:[510,112],4:[526,118],5:[524,110]};
let T=null,lastGeometry='';
async function refresh(){try{const next=await fetch('/state',{cache:'no-store'}).then(r=>r.json());T=next;render(true)}catch{}}
function render(force=false){if(!T)return;const style=Math.max(0,Math.min(5,+T.style||0)),b=BASES[style]||BASES[2],scale=Math.max(.78,Math.min(1,+T.scale||1));const g=[T.enabled,+T.x||0,+T.y||0,b[0],b[1],scale].join('|');if(force||g!==lastGeometry){lastGeometry=g;stage.style.display=T.enabled?'block':'none';stage.style.left=(+T.x||0)+'px';stage.style.top=(+T.y||0)+'px';stage.style.width=b[0]+'px';stage.style.height=b[1]+'px';stage.style.transform=`scale(${scale})`}if(T.enabled)TimerRenderer.apply(timerRoot,T,Date.now())}
refresh();setInterval(refresh,160);setInterval(()=>{if(T?.enabled&&T?.running)render(false)},100);
</script></body></html>
