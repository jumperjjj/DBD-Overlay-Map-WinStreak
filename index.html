<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>DBD Overlay Map & WinStreak</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e0f12;color:#f5f5f5;font:14px Segoe UI,Arial}main{max-width:900px;margin:auto;padding:26px}h1{margin:0;font-size:26px}.v{font-size:12px;color:#8f96a3}.sub{color:#9da5b3;margin:6px 0 20px}.hero{background:#181a20;border:1px solid #2d313a;border-radius:14px;padding:18px;margin-bottom:12px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#8f98a9}.state{font-size:20px;font-weight:700;margin:7px 0}.map{font-size:27px;font-weight:750;color:#e3c657;margin-top:7px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#181a20;border:1px solid #2d313a;border-radius:11px;padding:13px}.mini b{display:block;margin-top:5px;font-size:17px}.low{color:#79dc96}.wait{color:#79dc96}.read{color:#e3c657}.sleep{color:#91baff}button{margin-top:12px;padding:9px 13px;background:#252832;color:white;border:1px solid #3a3f49;border-radius:8px;cursor:pointer}details{margin-top:12px;background:#15171c;border:1px solid #292d35;border-radius:10px;padding:12px;color:#aeb5c0}summary{cursor:pointer;color:#d9dde5;font-weight:650}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:150px;overflow:auto}</style></head><body><main>
<h1>DBD Overlay Map & WinStreak <span class=v>Beta 1.2.1</span></h1><div class=sub>Detector automático de mapa — sem clique entre partidas.</div>
<div class=hero><div class=label>Detector de mapa</div><div id=state class="state">Inicializando...</div><div id=msg class=sub></div><div class=label>Mapa atual</div><div id=map class=map>—</div></div>
<div class=row><div class=mini><div class=label>Impacto esperado</div><b class=low>Baixo</b></div><div class=mini><div class=label>CPU do app</div><b id=cpu>—</b></div><div class=mini><div class=label>OCR pesado</div><b id=ocrn>0</b></div></div>
<button id=rearm>Forçar nova detecção (debug)</button>
<details><summary>Diagnóstico</summary><pre id=diag>Aguardando...</pre></details>
<script>
const $=x=>document.getElementById(x),names={BOOT:'INICIALIZANDO',ARMED:'AGUARDANDO MAPA',OCR:'LENDO MAPA',SLEEP:'EM PARTIDA / DORMINDO',ERROR:'ERRO'};
dbd.state(x=>{$('state').textContent=names[x.state]||x.state;$('state').className='state '+(x.state==='ARMED'?'wait':x.state==='OCR'?'read':x.state==='SLEEP'?'sleep':'');$('msg').textContent=x.message;if(x.map)$('map').textContent=x.map});
dbd.perf(x=>{$('cpu').textContent=x.cpu.toFixed(1)+'%';$('ocrn').textContent=x.ocrAttempts;if(x.map)$('map').textContent=x.map;if(x.state==='SLEEP')$('msg').textContent='Detector descansando. Rearme automático em '+Math.ceil(x.sleepLeft/1000)+' s.'});
dbd.diag(x=>{if(x.error){$('diag').textContent='Erro: '+x.error;return}if(x.kind==='watch')$('diag').textContent=`Sentinela\nFonte reduzida: ${x.source.w}×${x.source.h}\nRecorte: ${x.region.width}×${x.region.height}\nContraste: ${x.sd.toFixed(1)}\nBordas: ${(x.edge*100).toFixed(1)}%\nPixels claros: ${(x.bright*100).toFixed(1)}%\nPersistência: ${x.hits}/2`;else $('diag').textContent='OCR:\n'+(x.text||'(sem texto)')+(x.best?`\n\nCandidato: ${x.best.name} (${(x.best.score*100).toFixed(0)}%)`:'')});
dbd.detected(x=>$('map').textContent=x.name);$('rearm').onclick=()=>dbd.rearm();
</script></main></body></html>
