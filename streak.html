<!doctype html><html><head><meta charset=utf-8><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#o{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;gap:7%;font-family:Segoe UI;color:#fff}.bg,.deco{position:absolute;pointer-events:none}.bg{opacity:var(--op)}.name,.value{position:relative;z-index:2;white-space:nowrap}.name{font-family:var(--nf);font-size:var(--ns);font-weight:var(--bold);color:var(--nc);transform:translateX(var(--nx))}.value{font-family:var(--vf);font-size:var(--vs);font-weight:900;color:var(--vc);line-height:1;transform:translateX(var(--vx))}
.shadow{filter:drop-shadow(0 7px 7px #000c)}
.s1 .bg{inset:12%;background:var(--b1);clip-path:polygon(4% 0,94% 0,100% 50%,94% 100%,4% 100%,0 50%)}.s1 .deco{inset:12%;border-left:5px solid var(--a)}
.s2 .bg{inset:14%;background:var(--b1);border:2px solid var(--a);box-shadow:inset 0 0 18px color-mix(in srgb,var(--a) 35%,transparent);transform:skew(-7deg)}
.s3 .bg{inset:22% 10%;background:var(--b1);border-radius:9px;border-bottom:4px solid var(--a)}
.s4 .bg{inset:14% 7%;background:linear-gradient(105deg,var(--b2),var(--b1));clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}.s4 .deco:after{content:'///';color:var(--a);font-weight:900}
.s5 .bg{inset:8% 11%;background:var(--b1);border:3px solid var(--a);border-radius:999px}.s5 .value{border:2px solid var(--a);border-radius:999px;padding:.12em .3em}
.s6 .bg{inset:16% 8%;background:color-mix(in srgb,var(--b1) 76%,transparent);border:1px solid #fff5;border-radius:28px}
.s7 .bg{inset:12% 8%;background:var(--b1);border:4px double var(--a);box-shadow:5px 5px #000}
.s8 .bg{inset:23% 5%;background:var(--b1)}.s8 .deco{inset:23% 5%;border-left:8px solid var(--a);border-right:2px solid var(--a)}
.s9 .bg{inset:13% 6%;background:var(--b1);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);border-top:3px solid var(--a);border-bottom:3px solid var(--a)}
.s10 .bg{inset:18% 8%;background:var(--b1);border-top:1px solid var(--a);border-bottom:1px solid var(--a)}
.s11 .bg{inset:25% 9%;background:var(--b1);border-left:4px solid var(--a)}
.s12 .bg{inset:11% 8%;background:var(--b1);clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);border-top:2px solid var(--a);border-bottom:2px solid var(--a)}
.edit{outline:5px solid #ff2525;outline-offset:-5px;-webkit-app-region:drag}
</style></head><body><div id=o><div class=bg></div><div class=deco></div><div id=n class=name></div><div id=v class=value></div></div><script>
const o=document.getElementById('o');function draw(S){const s=S.streak;o.className='s'+(+s.style+1)+(s.shadow?' shadow':'');const x={'--a':s.accent,'--b1':s.bg1,'--b2':s.bg2,'--op':s.opacity,'--nc':s.nameColor,'--vc':s.valueColor,'--nf':s.fontName,'--vf':s.fontValue,'--ns':s.nameSize+'px','--vs':s.valueSize+'px','--nx':s.nameX+'px','--vx':s.valueX+'px','--bold':s.bold?900:500};for(const[k,v]of Object.entries(x))o.style.setProperty(k,v);n.textContent=s.title;v.textContent=s.value}api.get().then(x=>draw(x.state));api.onState(draw);api.onEdit(x=>o.classList.toggle('edit',x));
</script></body></html>
