<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="timer-render.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;cursor:url("assets/move-cursor.png") 16 16,move}
#timerRoot{width:100%;height:100%;-webkit-app-region:drag;cursor:url("assets/move-cursor.png") 16 16,move;user-select:none}
body.overlayLocked,body.overlayLocked #timerRoot{cursor:default;-webkit-app-region:no-drag}
</style></head>
<body><div id="timerRoot" class="timer-widget"></div>
<script src="timer-render.js"></script>
<script>
let T=null,lastAudioEventId=0,tickTimer=null,celebrationPhaseTimer=null,celebrationEndTimer=null;
const AUDIO={
  start:{src:'assets/timer-start.wav',volume:1.0},
  stop:{src:'assets/timer-stop.wav',volume:.88},
  victory:{src:'assets/timer-victory.wav',volume:1.0}
};
const audioBank={},audioCursor={};
function ensureAudioPool(kind){const cfg=AUDIO[kind];if(!cfg)return[];if(!audioBank[kind]){audioBank[kind]=Array.from({length:4},()=>{const a=new Audio(cfg.src);a.preload='auto';a.volume=cfg.volume;try{a.load()}catch{}return a});audioCursor[kind]=0}return audioBank[kind]}
Object.keys(AUDIO).forEach(ensureAudioPool);
function stopAllSounds(){for(const pool of Object.values(audioBank))for(const a of pool){try{a.pause();a.currentTime=0}catch{}}}
function playSound(kind){if(T?.soundEnabled===false)return;try{const pool=ensureAudioPool(kind);if(!pool.length)return;const idx=(audioCursor[kind]||0)%pool.length;audioCursor[kind]=idx+1;const a=pool[idx];try{a.pause();a.currentTime=0}catch{}a.volume=AUDIO[kind].volume;const p=a.play();if(p?.catch)p.catch(()=>setTimeout(()=>{if(T?.soundEnabled!==false){try{a.currentTime=0;a.play().catch(()=>{})}catch{}}},40))}catch{}}
function applyLock(){document.body.classList.toggle('overlayLocked',!!T?.locked)}
function renderFull(){if(T)TimerRenderer.apply(timerRoot,T,Date.now())}
function stopRenderWork(){if(tickTimer){clearInterval(tickTimer);tickTimer=null}if(celebrationPhaseTimer){clearTimeout(celebrationPhaseTimer);celebrationPhaseTimer=null}if(celebrationEndTimer){clearTimeout(celebrationEndTimer);celebrationEndTimer=null}}
function scheduleRenderWork(){
  stopRenderWork();
  if(T?.running)tickTimer=setInterval(()=>{if(T?.running)TimerRenderer.tick(timerRoot,T,Date.now())},50);
  const now=Date.now(),phaseAt=Number(T?.celebrationIntroUntil||0),endAt=Number(T?.celebrationUntil||0);
  if(phaseAt>now)celebrationPhaseTimer=setTimeout(()=>{celebrationPhaseTimer=null;renderFull()},Math.max(0,phaseAt-now)+24);
  if(endAt>now)celebrationEndTimer=setTimeout(()=>{celebrationEndTimer=null;renderFull()},Math.max(0,endAt-now)+32);
}
function applyState(next,allowAudio=true){if(!next)return;T=next;applyLock();renderFull();scheduleRenderWork();const id=Number(T.audioEventId)||0;if(T.soundEnabled===false)stopAllSounds();if(allowAudio&&T.soundEnabled!==false&&id&&id!==lastAudioEventId)playSound(String(T.audioEventType||''));lastAudioEventId=id}
api.onTimerState(s=>applyState(s,true));
api.onTimerEdit?.(()=>{});
(async()=>{const x=await api.timerGet();T=x.state;lastAudioEventId=Number(T?.audioEventId)||0;applyState(T,false)})();
</script></body></html>
