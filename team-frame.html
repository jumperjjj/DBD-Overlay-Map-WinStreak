<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif}
#o{position:absolute;inset:0;color:var(--txt,#fff);--a:#a86cff;--b:#6cff8d;--bg:#14171b;--panel:#25292d;--txt:#fff;--muted:#c8c8c8;display:flex;flex-direction:column;justify-content:center;padding:var(--pad,12px)}
.shell{position:relative;width:100%;filter:drop-shadow(0 7px 9px rgba(0,0,0,.72))}
.header{height:var(--hh,66px);display:grid;grid-template-columns:1fr 126px 1fr;align-items:center;background:var(--bg);border:1px solid #ffffff22;position:relative}
.team{font-size:var(--teamfs,22px);font-weight:900;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 18px}.ta{text-align:right}.tb{text-align:left}
.center{text-align:center}.set{font-size:10px;font-weight:800;letter-spacing:1.7px;color:var(--muted)}.score{font:900 var(--scorefs,32px) Arial Black,Impact,sans-serif;line-height:1.05}
.rows{display:flex;flex-direction:column;gap:var(--gap,4px);margin-top:var(--gap,4px)}
.row{height:var(--rh,28px);display:grid;grid-template-columns:180px 1fr 1fr;background:color-mix(in srgb,var(--panel) 92%,transparent);border-left:4px solid var(--a);align-items:center;overflow:hidden}
.row.hidden{display:none}.rlabel{height:100%;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:800;letter-spacing:.5px;background:#00000035;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rval{padding:0 12px;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rval.a{text-align:right;color:var(--a)}.rval.b{text-align:left;color:var(--b)}
.footer{margin-top:var(--gap,4px);height:var(--fh,24px);display:flex;align-items:center;padding:0 12px;background:color-mix(in srgb,var(--panel) 80%,transparent);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer.hidden{display:none}

/* 1 Broadcast */
.s1 .header{border-top:3px solid #ffffff28}.s1 .header:before{content:'';position:absolute;left:0;top:-3px;width:34%;height:3px;background:var(--a)}.s1 .header:after{content:'';position:absolute;right:0;top:-3px;width:34%;height:3px;background:var(--b)}
/* 2 Maven-inspired stacked, not a copy */
.s2 .header{clip-path:polygon(2% 0,98% 0,100% 50%,98% 100%,2% 100%,0 50%)}.s2 .row{border-left:0;border-right:4px solid var(--b)}.s2 .rlabel{border-left:4px solid var(--a)}
/* 3 Compact TV */
.s3 .header{border-radius:9px 9px 0 0}.s3 .rows{gap:1px;margin-top:1px}.s3 .row{border-left:0;border-bottom:1px solid #ffffff16}.s3 .footer{margin-top:1px;border-radius:0 0 9px 9px}
/* 4 Esports cut */
.s4 .header,.s4 .row,.s4 .footer{clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}.s4 .header{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 20%,var(--bg)),var(--bg) 38%,var(--bg) 62%,color-mix(in srgb,var(--b) 20%,var(--bg)))}
/* 5 Minimal */
.s5 .header{background:transparent;border:0;border-bottom:2px solid #ffffff33}.s5 .rows{gap:2px}.s5 .row{background:var(--bg);border-left:2px solid var(--a)}.s5 .footer{background:transparent;border-top:1px solid #ffffff22}
/* 6 Split color */
.s6 .header{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 30%,var(--bg)) 0 42%,var(--bg) 42% 58%,color-mix(in srgb,var(--b) 30%,var(--bg)) 58%)}.s6 .row{border-left:4px solid var(--a);border-right:4px solid var(--b)}
/* 7 Glass */
.s7 .header,.s7 .row,.s7 .footer{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(6px);border:1px solid #ffffff26}.s7 .row{border-left:3px solid var(--a)}
/* 8 Sharp */
.s8 .header{clip-path:polygon(0 0,96% 0,100% 50%,96% 100%,0 100%,3% 50%)}.s8 .row{margin-left:14px;margin-right:14px;width:auto}.s8 .footer{margin-left:28px;margin-right:28px}
.editing{outline:5px solid #ff2020;outline-offset:-5px}.editing{-webkit-app-region:drag}.handle{display:none;position:absolute;z-index:1000;width:15px;height:15px;background:#ff2020;border:2px solid white;-webkit-app-region:no-drag}.editing .handle{display:none}.nw{left:0;top:0;cursor:nwse-resize}.n{left:50%;top:0;cursor:ns-resize}.ne{right:0;top:0;cursor:nesw-resize}.e{right:0;top:50%;cursor:ew-resize}.se{right:0;bottom:0;cursor:nwse-resize}.s{left:50%;bottom:0;cursor:ns-resize}.sw{left:0;bottom:0;cursor:nesw-resize}.w{left:0;top:50%;cursor:ew-resize}
</style></head><body><div id=o><div class=shell><div class=header><div id=ta class="team ta"></div><div class=center><div id=set class=set></div><div class=score><span id=sa></span> - <span id=sb></span></div></div><div id=tb class="team tb"></div></div><div id=rows class=rows></div><div id=footer class=footer></div></div><i class="handle nw" data-edge=nw></i><i class="handle n" data-edge=n></i><i class="handle ne" data-edge=ne></i><i class="handle e" data-edge=e></i><i class="handle se" data-edge=se></i><i class="handle s" data-edge=s></i><i class="handle sw" data-edge=sw></i><i class="handle w" data-edge=w></i></div><script>
const $=x=>document.getElementById(x),o=$('o'),rows=$('rows');
function draw(s){o.className='s'+((+s.matchStyle||0)+1);for(const [k,v] of Object.entries({'--a':s.teamColorA,'--b':s.teamColorB,'--bg':s.matchBg,'--panel':s.matchPanel,'--txt':s.matchText,'--muted':s.matchMuted,'--pad':s.matchPadding+'px','--hh':s.matchHeaderHeight+'px','--rh':s.matchRowHeight+'px','--gap':s.matchGap+'px','--fh':s.matchFooterHeight+'px','--teamfs':s.matchTeamFontSize+'px','--scorefs':s.matchScoreFontSize+'px'}))o.style.setProperty(k,v);$('ta').textContent=s.teamA;$('tb').textContent=s.teamB;$('sa').textContent=s.teamScoreA;$('sb').textContent=s.teamScoreB;$('set').textContent=s.matchSetText||'';rows.innerHTML='';(s.matchRows||[]).forEach(r=>{const d=document.createElement('div');d.className='row'+(r.show?'':' hidden');d.innerHTML='<div class="rlabel"></div><div class="rval a"></div><div class="rval b"></div>';d.children[0].textContent=r.label||'';d.children[1].textContent=r.a||'';d.children[2].textContent=r.b||'';rows.appendChild(d)});$('footer').textContent=s.matchFooter||'';$('footer').classList.toggle('hidden',!s.matchFooterShow)}
async function tick(){try{draw(await fetch('/state?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()))}catch{}}tick();setInterval(tick,200);
</script></body></html>
