<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}iframe{position:absolute;border:0;background:transparent;overflow:hidden;transform-origin:0 0}</style></head><body><iframe id="streak" src="/obs-streak"></iframe><iframe id="match" src="/obs-match"></iframe><script>
async function tick(){try{const S=await fetch('/state',{cache:'no-store'}).then(r=>r.json());const s=S.streak,m=S.match;streak.style.display=s.enabled?'block':'none';streak.style.left=(s.x||0)+'px';streak.style.top=(s.y||0)+'px';streak.style.width='350px';streak.style.height='285px';streak.style.transform=`scale(${Math.max(.6,Math.min(1.4,+s.scale||1))})`;const mw=640+(m.killerImage?120:0);match.style.display=m.enabled?'block':'none';match.style.left=(m.x||0)+'px';match.style.top=(m.y||0)+'px';match.style.width=mw+'px';match.style.height='200px';match.style.transform=`scale(${Math.max(.6,Math.min(1.3,+m.scale||1))})`}catch{}}
setInterval(tick,150);tick();
</script></body></html>
