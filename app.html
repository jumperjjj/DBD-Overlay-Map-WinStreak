function drawMaps(q=''){maplist.innerHTML='';MAPS.filter(m=>m.name.toLowerCase().includes(q.toLowerCase())).forEach(m=>{let b=document.createElement('button');b.className='mapb'+(S.map.name===m.name?' sel':'')+(m.hasImage?'':' missing');b.innerHTML='<span>'+m.name+'</span><span class="status">'+(m.hasImage?'✓':'—')+'</span>';b.onclick=()=>{if(!m.hasImage){mapNotice.style.display='block';mapNotice.textContent=T[S.language].noImage+' '+m.name;return}mapNotice.style.display='none';api.selectMap(m.name)};maplist.appendChild(b)})}
