['title','nameFont','numberFont','nameColor','numberColor','accent','boxColor','boxColor2','style','nameFontSize','numberFontSize','nameOffsetX','numberOffsetX','letterSpacing','numberSpacing','bgOpacity'].forEach(id=>window[id].oninput=e=>patch({[id]:['style','nameFontSize','numberFontSize','nameOffsetX','numberOffsetX','letterSpacing','numberSpacing','bgOpacity'].includes(id)?+e.target.value:e.target.value}));

edit.onclick=()=>api.edit(true);save.onclick=async()=>{S=await api.savePos();render()};streakScale.oninput=async e=>{await api.edit(true);S=await api.scale('streak',e.target.value);render()};teamScale.oninput=async e=>{await api.edit(true);S=await api.scale('team',e.target.value);render()};
